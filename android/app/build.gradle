apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// Expo modules
apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle")

// React Native Config - Load environment variables from .env
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def uploadKeystorePropertiesFile = rootProject.file("upload-keystore.properties")
def uploadKeystoreProperties = new Properties()

if (uploadKeystorePropertiesFile.exists()) {
    uploadKeystoreProperties.load(new FileInputStream(uploadKeystorePropertiesFile))
}

android {
    namespace "com.firefighterwellnessapp"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.firefighterwellnessapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        // Load environment variables from .env file (react-native-config)
        resValue "string", "build_config_package", "com.firefighterwellnessapp"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (!uploadKeystorePropertiesFile.exists()) {
                throw new GradleException("Missing android/upload-keystore.properties. Generate an upload key before building release.")
            }

            storeFile file(uploadKeystoreProperties['storeFile'])
            storePassword uploadKeystoreProperties['storePassword']
            keyAlias uploadKeystoreProperties['keyAlias']
            keyPassword uploadKeystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Firebase (managed through @react-native-firebase)
    implementation platform('com.google.firebase:firebase-bom:33.11.0')
    implementation 'com.google.firebase:firebase-analytics'

    // Kotlin (already included by React Native, but safe to reference)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
